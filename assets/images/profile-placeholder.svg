<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle circular accent frame -->
  <circle cx="200" cy="170" r="90" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Abstract Head & Body Silhouette -->
  <circle cx="200" cy="140" r="42" fill="#94a3b8" />
  <path d="M 130 245 C 130 195, 270 195, 270 245 Z" fill="#94a3b8" />
  
  <!-- Camera / Upload Indicator -->
  <circle cx="255" cy="225" r="22" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="3" />
  <path d="M246 225 L264 225 M255 216 L255 234" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Placeholder Label Badge -->
  <rect x="70" y="305" width="260" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Profile Photo Placeholder</text>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Replace with assets/profile.jpg</text>
</svg>
